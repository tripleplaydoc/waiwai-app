# Netlify config (repo root). The app lives in the "webapp" folder.
# publish is relative to the base folder: webapp/.next. Without it Netlify
# defaults publish to the base folder itself and the Next.js plugin refuses.
[build]
  base = "webapp"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"
