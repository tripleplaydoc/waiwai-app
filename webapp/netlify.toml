# Same settings, for the case where the Netlify site's "Base directory" is
# already set to "webapp" in the Netlify dashboard (then this file is read
# instead of the one at the repo root).
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"
